name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: .
          command: tools/idf-build.sh firmware esp32 build

      - name: Stage release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Bake the tag into the filename so a downloaded copy is obviously
          # versioned once the browser strips its Content-Disposition header.
          OTA="dragonvent-${RELEASE_TAG}-ota.bin"
          cp firmware/build/dragonvent.bin "dist/${OTA}"
          cd dist
          sha256sum "${OTA}" > SHA256SUMS
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          cat > release_notes.md <<NOTES
          ## Install over stock — from a browser, no cable

          As of v0.5.0, DragonVent runs on the **stock Panda Vent partition table**, so you install and update it **entirely from the web UI** — no serial cable, no disassembly, no helper scripts. The stock bootloader is preserved; only the app slot is written.

          - **\`dragonvent-${RELEASE_TAG}-ota.bin\`** — the app image. One file for both the over-stock install **and** updating an existing DragonVent.

          ### Install over stock (recommended)

          1. Download **\`dragonvent-${RELEASE_TAG}-ota.bin\`** from the Assets below.
          2. Put the **stock** Panda Vent on your network and open its web UI (\`http://PandaVent.local/\` or its IP).
          3. On the stock firmware-update page, upload the \`ota.bin\`. The stock firmware writes DragonVent to its inactive slot and reboots into it.
          4. First boot comes up as the **\`DragonVent_XXXX\`** setup AP (WPA2, password \`987654321\`) — join it to enter WiFi + printer settings. It's then on mDNS as **\`DragonVent.local\`**.

          ### Updating an existing DragonVent

          Open the DragonVent web UI, go to **Device setup → Maintenance**, and upload the \`ota.bin\`. It writes the inactive slot and reboots — nothing else to install.

          ### ⚠ Upgrading from 0.4.x (one-time roll-back)

          0.4.x used a **different partition table**, so you can't OTA straight from 0.4.x to 0.5.x. Roll back to your stock backup over USB first, then install over stock from the web UI as above:

          \`\`\`
          python -m esptool --chip esp32 -p PORT -b 460800 write_flash 0x0 stock-panda-vent-backup.bin
          \`\`\`

          0.5.0 and later update **in place** (inactive-slot OTA) — no roll-back needed again.

          ### ⚠ Back up stock first

          BTT publishes no stock image, so dump the flash over USB **before** your first install — it's your only way back:

          \`\`\`
          python -m esptool --chip esp32 -p PORT -b 460800 read_flash 0x0 0x400000 stock-panda-vent-backup.bin
          \`\`\`

          \`PORT\` = \`/dev/ttyUSB0\` (Linux), \`/dev/tty.usbserial-*\` (macOS), \`COM3\` (Windows). If a DragonVent ever won't boot, write that same backup back with the \`write_flash\` command above, then re-install over stock.

          ### Verify download

          \`\`\`
          shasum -a 256 -c SHA256SUMS
          \`\`\`
          NOTES

          # A semver pre-release tag carries a hyphenated suffix (v0.4.0-rc1,
          # v1.0.0-beta2). Publish those as GitHub pre-releases so they are not
          # marked "Latest" — otherwise a test build displaces the current
          # stable release for everyone using the install helper's default.
          PRERELEASE_FLAGS=""
          case "$RELEASE_TAG" in
            *-*) PRERELEASE_FLAGS="--prerelease"
                 echo "Publishing $RELEASE_TAG as a pre-release" ;;
            *)   PRERELEASE_FLAGS="--latest"
                 echo "Publishing $RELEASE_TAG as a stable release" ;;
          esac

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release_notes.md $PRERELEASE_FLAGS
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md $PRERELEASE_FLAGS
          fi
