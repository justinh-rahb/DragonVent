name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: .
          command: tools/idf-build.sh firmware esp32 build

      - name: Merge into a single flashable image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: firmware
          command: >
            python -m esptool --chip esp32 merge_bin -o dragonvent-factory.bin
            --flash_mode dio --flash_size 4MB --flash_freq 40m
            0x1000 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xc000 build/ota_data_initial.bin
            0x10000 build/dragonvent.bin

      - name: Stage release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Bake the tag into the filename so a downloaded copy is obviously
          # versioned once the browser strips its Content-Disposition header.
          # The dragonvent install helper still finds these via a glob pattern.
          FULL="dragonvent-${RELEASE_TAG}-factory.bin"
          OTA="dragonvent-${RELEASE_TAG}-ota.bin"
          mv firmware/dragonvent-factory.bin "dist/${FULL}"
          cp firmware/build/dragonvent.bin "dist/${OTA}"
          cd dist
          sha256sum "${FULL}" "${OTA}" > SHA256SUMS
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          cat > release_notes.md <<NOTES
          ## Install over stock — no USB cable needed

          As of v0.5.0, DragonVent runs on the **stock Panda Vent partition table**, so you can install it **directly over the stock BTT firmware from a browser** — no serial cable, no disassembly. The stock bootloader is preserved; only the app slot is written.

          - **\`dragonvent-${RELEASE_TAG}-ota.bin\`** — the app image. Use this for the over-stock install **and** for updating an existing DragonVent.
          - **\`dragonvent-${RELEASE_TAG}-factory.bin\`** — full image (bootloader + table + app) for USB recovery only.

          ### Install over stock (recommended)

          1. Put the **stock** Panda Vent on your network (its web UI is at \`http://PandaVent.local/\` or its IP).
          2. Install with the helper — it fetches the file, verifies the SHA, and uploads it:
             \`\`\`
             scripts/dragonvent install -t ${RELEASE_TAG} -H PandaVent.local
             \`\`\`
             …or upload \`dragonvent-${RELEASE_TAG}-ota.bin\` yourself from the stock firmware-update page.
          3. The stock firmware writes DragonVent to its inactive slot and reboots into it. First boot comes up as the **\`DragonVent_XXXX\`** setup AP (WPA2, password \`987654321\`) — join it to enter WiFi + printer settings. It's then on mDNS as **\`DragonVent.local\`**.

          ### ⚠ Upgrading from 0.4.x (one-time roll-back)

          0.4.x used a **different partition table**, so you can't OTA straight from 0.4.x to 0.5.0. Roll back to stock first, then install over stock — exactly like the DragonBreath 1.0 migration:

          \`\`\`
          scripts/dragonvent restore stock-panda-vent-backup.bin      # your stock backup
          scripts/dragonvent install -t ${RELEASE_TAG} -H PandaVent.local
          \`\`\`

          0.5.0 and later update **in place** (inactive-slot OTA) — no roll-back needed again.

          ### ⚠ Back up stock first

          BTT publishes no stock image, so dump the flash over USB **before** your first install — it's your only way back:

          \`\`\`
          scripts/dragonvent backup                                             # or:
          python -m esptool --chip esp32 -p PORT -b 460800 read_flash 0x0 0x400000 stock-panda-vent-backup.bin
          \`\`\`

          ### Updating an existing DragonVent

          Upload \`dragonvent-${RELEASE_TAG}-ota.bin\` from **Device setup → Maintenance** in the web UI (or \`scripts/dragonvent install\`). It writes the inactive slot and reboots.

          ### USB recovery (fallback)

          If the device won't boot, flash the full image over serial:

          \`\`\`
          python -m esptool --chip esp32 -p PORT -b 460800 write_flash 0x0 dragonvent-${RELEASE_TAG}-factory.bin
          \`\`\`

          \`PORT\` = \`/dev/ttyUSB0\` (Linux), \`/dev/tty.usbserial-*\` (macOS), \`COM3\` (Windows).

          ### Verify download

          \`\`\`
          shasum -a 256 -c SHA256SUMS
          \`\`\`
          NOTES

          # A semver pre-release tag carries a hyphenated suffix (v0.4.0-rc1,
          # v1.0.0-beta2). Publish those as GitHub pre-releases so they are not
          # marked "Latest" — otherwise a test build displaces the current
          # stable release for everyone using the install helper's default.
          PRERELEASE_FLAGS=""
          case "$RELEASE_TAG" in
            *-*) PRERELEASE_FLAGS="--prerelease"
                 echo "Publishing $RELEASE_TAG as a pre-release" ;;
            *)   PRERELEASE_FLAGS="--latest"
                 echo "Publishing $RELEASE_TAG as a stable release" ;;
          esac

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release_notes.md $PRERELEASE_FLAGS
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md $PRERELEASE_FLAGS
          fi
